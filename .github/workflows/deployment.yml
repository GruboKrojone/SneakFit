name: CI/CD Pipeline

on:
  push:
    branches: ["prod", "test", "dev", "SF-*"]
  pull_request:
    branches: ["prod", "test", "dev"]

jobs:
  backend-build-and-test:
    name: Build and Test Backend
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2019-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Password123$d
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >-
          --health-cmd="/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'YourStrong!Passw0rd' -Q 'SELECT 1' || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: Backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore SneakFIt.sln

      - name: Build Debug
        run: dotnet build SneakFIt.sln --configuration Debug --no-restore

      - name: Build Release
        run: dotnet build SneakFIt.sln --configuration Release --no-restore

      - name: Run EF Migrations
        run: |
          dotnet tool install --global dotnet-ef
          dotnet ef database update --project Domain --startup-project API --context SneakFitDbContext
        env:
          ConnectionStrings__SneakFitDbContext: "Server=localhost,1433;Database=SneakFit_CI;User Id=sa;Password=Password123$d;TrustServerCertificate=True;Encrypt=False"

      - name: Run unit tests
        run: dotnet test SneakFIt.sln --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Backend Test Results
          path: Backend/**/test-results.trx
          reporter: dotnet-trx

      - name: Publish API (Release)
        run: dotnet publish API/API.csproj --configuration Release --no-build --output ./publish

      - name: Upload API artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-api-${{ github.sha }}
          path: Backend/publish
          retention-days: 30

  frontend-build:
    name: Build Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Upload Frontend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: Frontend/dist
          retention-days: 30
